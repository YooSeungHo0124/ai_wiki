<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Wiki — 인공지능 논문 계보</title>
<meta name="description" content="컴퓨터 비전 · LLM · 생성모델 · 멀티모달 · 강화학습까지, 인공지능의 흐름을 바꾼 논문들을 계보로 잇고 한 편씩 정리한 한국어 개인 위키">
<!-- 테마 부트스트랩 — <head> 최상단, CSS보다 먼저 실행돼야 FOUC가 없다
     (design/DARK-AUDIT.md: 예전엔 body 끝 js/wiki/app.js에 있어, 저장된 선택이
     'light'인데 OS가 dark인 사용자는 CSS의 prefers-color-scheme 폴백으로 일단
     dark로 페인트된 뒤 app.js 로드 후 light로 뒤집히는 FOUC가 구조적으로
     있었다). 우선순위: 저장된 선택 → 없으면 OS(prefers-color-scheme) → 그래도
     없으면 기본값(dark, 기존 하드코딩값과 동일해 첫 방문자 경험을 바꾸지 않는다).
     app.js는 이제 토글 배선만 담당한다(초기 판정은 하지 않음). -->
<script>(function(){
  try{
    var t=localStorage.getItem('wiki-theme');
    if(t!=='light'&&t!=='dark'){
      t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':
        (window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
    }
    document.documentElement.setAttribute('data-theme',t);
  }catch(e){ document.documentElement.setAttribute('data-theme','dark'); }
})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/tokens.css?v=16">
<link rel="stylesheet" href="css/wiki.css?v=16">
<link rel="stylesheet" href="css/diagram.css?v=16">
<link rel="stylesheet" href="css/shelf.css?v=16">
<link rel="stylesheet" href="css/graph.css?v=16">
<link rel="stylesheet" href="css/graphview.css?v=16">
<!-- cover.css는 표지 카드를 처음 열 때 js/wiki/app.js의 ensureCover()가 동적으로
     붙인다 — cover.js가 로드되자마자 content/meta.json(178KB)을 즉시 fetch하므로
     홈 초기 전송 예산(500KB, A11Y-PERF.md §2.1)을 지키려면 상시 로드하지 않는다. -->
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/" aria-label="AI Wiki 홈으로">
    <span class="logo">▤</span>
    <div>
      <h1>AI Wiki</h1>
      <p>인공지능 논문 계보 — 흐름을 바꾼 논문만 한 편씩</p>
    </div>
  </a>
  <div class="spacer"></div>
  <div class="searchbox">
    <input id="q" placeholder="논문 검색  ( / )" autocomplete="off" aria-label="논문 검색" role="combobox" aria-expanded="false" aria-controls="res" aria-autocomplete="list">
    <div class="results" id="res" role="listbox" aria-label="검색 결과"></div>
  </div>
  <button class="ghost-btn" id="themeBtn" title="밝은/어두운 테마" aria-label="밝은/어두운 테마 전환">◐</button>
</header>

<main id="app"></main>

<!-- KaTeX(275KB)는 홈에서 쓸 일이 없다 — 논문 페이지 진입 시 js/wiki/app.js의
     ensureKatex()가 필요할 때만 동적으로 붙인다(A11Y-PERF.md 감사 지적 대응).
     여기서 <script> 태그로 즉시 내려받지 않는다. -->
<script>window.WIKI={V:16};</script>
<script src="content/fields.js?v=16"></script>
<script src="js/wiki/core.js?v=16"></script>
<script src="js/wiki/diagram.js?v=16"></script>
<script src="js/wiki/graph.js?v=16"></script>
<!-- 책장은 홈 첫 렌더에 필요하므로 동기 로드. js/wiki/app.js는 그래도 W.shelf/
     W.wireShelf가 없는 경우(로드 실패 등)에도 깨지지 않게 방어적으로 호출한다. -->
<script src="js/wiki/shelf.js?v=16"></script>
<!-- graphview.js: 계보 그래프 전체 화면 뷰어(GRAPH-REFERENCES.md 권고 1·5).
     app.js가 W._wireGraphSelection을 노출한 뒤에 참조하므로 app.js보다 먼저
     로드해도/나중에 로드해도 상관없다(둘 다 호출 시점에만 W.* 를 읽는다) —
     여기서는 W.graph/graph.js 바로 다음, app.js 이전에 둔다. -->
<script src="js/wiki/graphview.js?v=16"></script>
<!-- cover.js는 표지 카드를 처음 열 때만 동적으로 붙인다(ensureCover(), app.js). -->
<script src="js/wiki/app.js?v=16"></script>
</body>
</html>
