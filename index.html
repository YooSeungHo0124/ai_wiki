<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Wiki — 인공지능 논문 계보</title>
<meta name="description" content="컴퓨터 비전 · LLM · 생성모델 · 멀티모달 · 강화학습까지, 인공지능의 흐름을 바꾼 논문들을 계보로 잇고 한 편씩 정리한 한국어 개인 위키">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/tokens.css?v=11">
<link rel="stylesheet" href="css/wiki.css?v=11">
<link rel="stylesheet" href="css/diagram.css?v=11">
<link rel="stylesheet" href="css/shelf.css?v=11">
<!-- cover.css는 표지 카드를 처음 열 때 js/wiki/app.js의 ensureCover()가 동적으로
     붙인다 — cover.js가 로드되자마자 content/meta.json(178KB)을 즉시 fetch하므로
     홈 초기 전송 예산(500KB, A11Y-PERF.md §2.1)을 지키려면 상시 로드하지 않는다. -->
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/" aria-label="AI Wiki 홈으로">
    <span class="logo">▤</span>
    <div>
      <h1>AI Wiki</h1>
      <p>인공지능 논문 계보 — 흐름을 바꾼 논문만 한 편씩</p>
    </div>
  </a>
  <div class="spacer"></div>
  <div class="searchbox">
    <input id="q" placeholder="논문 검색  ( / )" autocomplete="off" aria-label="논문 검색" role="combobox" aria-expanded="false" aria-controls="res" aria-autocomplete="list">
    <div class="results" id="res" role="listbox" aria-label="검색 결과"></div>
  </div>
  <button class="ghost-btn" id="themeBtn" title="밝은/어두운 테마" aria-label="밝은/어두운 테마 전환">◐</button>
</header>

<main id="app"></main>

<!-- KaTeX(275KB)는 홈에서 쓸 일이 없다 — 논문 페이지 진입 시 js/wiki/app.js의
     ensureKatex()가 필요할 때만 동적으로 붙인다(A11Y-PERF.md 감사 지적 대응).
     여기서 <script> 태그로 즉시 내려받지 않는다. -->
<script>window.WIKI={V:11};</script>
<script src="content/fields.js?v=11"></script>
<script src="js/wiki/core.js?v=11"></script>
<script src="js/wiki/diagram.js?v=11"></script>
<script src="js/wiki/graph.js?v=11"></script>
<!-- 책장은 홈 첫 렌더에 필요하므로 동기 로드. js/wiki/app.js는 그래도 W.shelf/
     W.wireShelf가 없는 경우(로드 실패 등)에도 깨지지 않게 방어적으로 호출한다. -->
<script src="js/wiki/shelf.js?v=11"></script>
<!-- cover.js는 표지 카드를 처음 열 때만 동적으로 붙인다(ensureCover(), app.js). -->
<script src="js/wiki/app.js?v=11"></script>
</body>
</html>
